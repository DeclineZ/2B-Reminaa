<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="../static/styles.css">
    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='../static/assets/bootstrap/css/bootstrap.min.css') }}"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='../static/assets/fonts/fontawesome-all.min.css') }}"
    >
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped&display=swap">
</head>
<body>
  <nav class="navbar">
    <div class="logo">
        <img src="https://c8.alamy.com/comp/ERAWHT/old-man-with-a-big-beard-and-a-smile-on-white-background-ERAWHT.jpg" alt="" style="max-height: 50px; border-radius: 50px;">
        <strong>คุณตา สะเทือน</strong>
    </div>
    <div class="home"><a href="/" style="text-decoration:none; color: #7F8AFF; font-size: 35px">  ⏏  </a></div>
    <div class="profile">
      <button onclick="window.location.href='/add_data'">+ สำหรับผู้ดูแล</button>
    </div>
  </nav>
  <div class="contain">
    <div class="fade-in">
      <audio controls style="width: 100%;">
        <source src="{{ element.sound }}" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
        <img src="{{ element.img_link }}" alt="Random Image" class="responsive-img" style="margin-bottom: 20px;">
      </div>
    
      <button id="recordButton" class="pulse fade-in-delayed" onclick="toggleRecording()">Start</button>
    
      <div class="text-box fade-in-delayed">
        <p id="assistantResponse" class="typing">{{ assistant_reply }}</p>
      </div>
    
      <div id="transcript" class="transcript-box"></div>
  </div>
  <div class="powered-by">powered by Typhoon V2</div>

      <script>
        let speaking = false;
        let hasSpokenBefore = false;

        // Speech synthesis function
        function speakText(text) {
          if (text.trim()) {
            responsiveVoice.cancel();
            speaking = true;
            const recordBtn = document.getElementById('recordButton');
            recordBtn.disabled = true;
        
            let enabled = false;
            const enableOnce = () => {
              if (!enabled) {
                recordBtn.disabled = false;
                speaking = false;
                enabled = true;
                console.log("Button re-enabled (onend or timeout).");
              }
            };
        
            const speakNow = () => {
              responsiveVoice.speak(text, "Thai Male", {
                onend: function () {
                  console.log("responsiveVoice onend fired");
                  enableOnce();
                }
              });
        
              // Failsafe: if onend doesn't fire within 6s (first time bug)
              setTimeout(() => {
                console.log("Failsafe timeout fired");
                enableOnce();
              }, 6000);
            };
        
            if (!hasSpokenBefore) {
              hasSpokenBefore = true;
              speakNow();
            } else {
              speakNow();
            }
          }
        }
      
        // Generic typing animation function that returns a Promise when done.
        function typeOutText(el, text, speed = 30) {
          return new Promise((resolve) => {
            el.innerText = '';  // Clear current text
            let i = 0;
            const interval = setInterval(() => {
              el.innerText += text[i];
              i++;
              if (i >= text.length) {
                clearInterval(interval);
                resolve();
              }
            }, speed);
          });
        }
      
        // Set up MutationObserver to trigger typing animation on updates
        const AIchat = document.getElementById('assistantResponse');
        if (AIchat) {
          let observerDisabled = false; // Flag to prevent recursion during animation
      
          const observer = new MutationObserver((mutationsList) => {
            if (observerDisabled) return;
            // Get the updated text; note that multiple mutations might occur,
            // so we use the current text content.
            const newText = AIchat.textContent.trim();
            if (newText) {
              observerDisabled = true;
              // Run the typing animation and then speak the text
              typeOutText(AIchat, newText, 10).then(() => {
                speakText(newText);
                observerDisabled = false;
              });
            }
          });
      
          const config = {
            childList: true,
            subtree: true,
            characterData: true
          };
      
          observer.observe(AIchat, config);
      
          // Also handle the initial text on window load
          window.addEventListener('load', () => {
            const initialText = AIchat.textContent.trim();
            if (initialText) {
              observerDisabled = true;
              typeOutText(AIchat, initialText, 10).then(() => {
                speakText(initialText);
                observerDisabled = false;
              });
            }
          });
        } else {
          console.warn("Element with ID 'assistantResponse' not found.");
        }
      </script>
      
      <script src="assets/bootstrap/js/bootstrap.min.js"></script>
      
      <script>
        // Toggle recording button functionality remains unchanged
        function toggleRecording() {
          const btn = document.getElementById('recordButton');
          if (speaking == false) {
            if (btn.innerText === "Start") {
              btn.innerText = "Stop";
              btn.classList.add("listening");
            } else {
              btn.innerText = "Start";
              btn.classList.remove("listening");
            }
          }
        }
      </script>
      
      <script>
        // Check for SpeechRecognition API support
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!window.SpeechRecognition) {
          document.getElementById('transcript').innerText = "Sorry, your browser does not support Speech Recognition.";
        } else {
          const recognition = new SpeechRecognition();
          recognition.continuous = true; // Keep listening for multiple phrases
          recognition.lang = 'th-TH';
          recognition.interimResults = false; // Only final results
      
          let isRecording = false;
          let fullTranscript = ""; // Will hold the entire transcript for the session
          const recordBtn = document.getElementById('recordButton');
          const transcriptDisplay = document.getElementById('transcript');
      
          recordBtn.addEventListener('click', () => {
            if (!isRecording) {
              fullTranscript = "";
              transcriptDisplay.textContent = "Listening...";
              recognition.start();
              isRecording = true;
              recordBtn.textContent = "Stop Recording";
            } else {
              recognition.stop();
              isRecording = false;
              recordBtn.textContent = "Start Recording";
          
              recordBtn.disabled = true; // Disable here — but do NOT re-enable after 3s anymore!
          
              fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: fullTranscript })
              })
              .then(response => response.json())
              .then(data => {
                document.getElementById('assistantResponse').innerText = data.reply;
                // Typing animation will trigger speakText() → which will re-enable the button
              })
              .catch(error => {
                console.error("Error:", error);
              });
            }
          });
      
          recognition.onresult = (event) => {
            // Append each new result to the full transcript
            for (let i = event.resultIndex; i < event.results.length; i++) {
              fullTranscript += event.results[i][0].transcript + " ";
            }
            transcriptDisplay.textContent = fullTranscript;
          };
      
          recognition.onerror = (event) => {
            transcriptDisplay.textContent = "Error: " + event.error;
            isRecording = false;
            recordBtn.textContent = "Start Recording";
          };
      
          recognition.onend = () => {
            // Optionally auto-restart if needed.
          };
        }
      </script>
      
</body>
<script src="https://code.responsivevoice.org/responsivevoice.js?key=jFvG5zaR"></script>
</html>
